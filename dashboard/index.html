<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef}=React;
const {BarChart,Bar,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid,Legend}=Recharts;

const NAVY="#0F2258",GOLD="#C9A84C",KEY="modo-on-v3";

const AIRLINES=[
  {name:"LATAM",           short:"LATAM",   color:"#E31837",url:"https://www.latamairlines.com/br/pt/minhas-viagens",          fields:["localizador","sobrenome"]},
  {name:"GOL",             short:"GOL",     color:"#FF6600",url:"https://b2c.voegol.com.br/minhas-viagens/encontrar-viagem",   fields:["localizador","origem","sobrenome"]},
  {name:"Azul",            short:"Azul",    color:"#1B3C8F",url:"https://www.voeazul.com.br/br/pt/home/reservas",              fields:["localizador","origem"]},
  {name:"American Airlines",short:"AA",     color:"#1B1B6B",url:"https://www.aa.com/reservation/view/find-your-reservation",   fields:["localizador","sobrenome"]},
  {name:"TAP",             short:"TAP",     color:"#006400",url:"https://www.flytap.com/pt-br/minha-reserva",                  fields:["localizador","sobrenome"]},
  {name:"Iberia",          short:"Iberia",  color:"#C8102E",url:"https://www.iberia.com/br/minha-viagem/",                     fields:["localizador","sobrenome"]},
  {name:"Air Europa",      short:"AirEU",   color:"#003DA5",url:"https://www.aireuropa.com/br/pt/aea/ajuda/gestionar-mi-viaje",fields:["localizador","sobrenome"]},
  {name:"Royal Air Maroc", short:"RAM",     color:"#CF0A2C",url:"https://www.royalairmaroc.com/br-pt/booking/manage-booking",  fields:["localizador","sobrenome"]},
  {name:"Avianca",         short:"Avianca", color:"#E4002B",url:"https://www.avianca.com/br/pt/experiencia-de-voo/gerenciar-reserva/",fields:["localizador","sobrenome"]},
  {name:"Copa Airlines",   short:"Copa",    color:"#00205B",url:"https://www.copaair.com/pt-gs/web/check-in/minha-reserva/",   fields:["localizador","sobrenome"]},
  {name:"Delta",           short:"Delta",   color:"#003366",url:"https://www.delta.com/us/en/need-help/overview",              fields:["localizador","sobrenome"]},
  {name:"United",          short:"United",  color:"#00274E",url:"https://www.united.com/en/us/manageres/",                     fields:["localizador","sobrenome"]},
  {name:"KLM",             short:"KLM",     color:"#009BDE",url:"https://www.klm.com.br/information/manage-your-trip",         fields:["localizador","sobrenome"]},
  {name:"Air France",      short:"AirFR",   color:"#002395",url:"https://www.airfrance.com.br/informacoes/gerenciar-sua-reserva",fields:["localizador","sobrenome"]},
  {name:"Lufthansa",       short:"LH",      color:"#05164D",url:"https://www.lufthansa.com/br/pt/minha-reserva",               fields:["localizador","sobrenome"]},
  {name:"Turkish Airlines",short:"Turkish", color:"#C8102E",url:"https://www.turkishairlines.com/pt-br/flights/manage-booking/",fields:["localizador","sobrenome"]},
  {name:"Outra",           short:"Outra",   color:"#6b7280",url:null,                                                          fields:["localizador","sobrenome"]},
];

const STATUS_CFG={
  Emitido:    {color:"#16a34a",bg:"#dcfce7",border:"#86efac"},
  Confirmado: {color:"#2563eb",bg:"#dbeafe",border:"#93c5fd"},
  Pendente:   {color:"#d97706",bg:"#fef3c7",border:"#fcd34d"},
  Cancelado:  {color:"#dc2626",bg:"#fee2e2",border:"#fca5a5"},
  Reembolsado:{color:"#7c3aed",bg:"#ede9fe",border:"#c4b5fd"},
  "No-Show":  {color:"#6b7280",bg:"#f3f4f6",border:"#d1d5db"},
};
const MON_CFG={
  on_time:  {color:"#16a34a",bg:"#dcfce7",label:"No horário",icon:"🟢"},
  delayed:  {color:"#d97706",bg:"#fef3c7",label:"Atrasado",  icon:"🟡"},
  cancelled:{color:"#dc2626",bg:"#fee2e2",label:"Cancelado", icon:"🔴"},
  changed:  {color:"#2563eb",bg:"#dbeafe",label:"Alterado",  icon:"🔵"},
  unknown:  {color:"#6b7280",bg:"#f3f4f6",label:"Sem info",  icon:"⚪"},
  error:    {color:"#d97706",bg:"#fef3c7",label:"Erro",       icon:"⚠️"},
};
const PGTO=["PIX","Cartão à vista","Parcelado no cartão","Transferência","Boleto"];

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const todayS=()=>new Date().toISOString().split("T")[0];
const brl=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const pctFmt=v=>`${Number(v||0).toFixed(1)}%`;
function daysUntil(ds){if(!ds)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds+"T12:00:00")-t)/86400000);}
function fmtFull(ds){if(!ds)return"—";const[y,m,d]=ds.split("-");return`${d}/${m}/${y}`;}
function hoursSince(iso){if(!iso)return 999;return(Date.now()-new Date(iso).getTime())/3600000;}
function emptyForm(){return{localizador:"",localizadorCia:"",airline:"LATAM",cliente:"",sobrenome:"",origem:"",destino:"",dataVoo:"",status:"Emitido",obs:"",ultimaVer:"",numeroVoo:"",horarioPartida:"",horarioChegada:"",valorVenda:"",valorCusto:"",taxaEmbarque:"",formaPagamento:"PIX",parcelas:"1",monitorStatus:null};}

function lsGet(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch{return null;}}
function lsSet(data){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){console.error(e);}}
function getApiKey(){return localStorage.getItem("modo-on-apikey")||"";}
function setApiKey(k){localStorage.setItem("modo-on-apikey",k);}

async function checkFlightAPI(apiKey,numeroVoo,dataVoo,origem,destino){
  if(!apiKey)return{status:"unknown",info:"Configure sua API key em Configurações",checkedAt:new Date().toISOString()};
  const prompt=`Pesquise o status atual do voo ${numeroVoo} na data ${dataVoo} (${origem||"?"}→${destino||"?"}). Responda SOMENTE com JSON válido:\n{"status":"on_time","delay_minutes":0,"departure":"HH:MM","arrival":"HH:MM","info":"resumo em português, max 80 chars"}\nStatus aceitos: "on_time","delayed","cancelled","changed","unknown"`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:prompt}]})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error?.message||"Erro API");
    const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const m=text.match(/\{[\s\S]*?"status"[\s\S]*?\}/);
    if(m)return{...JSON.parse(m[0]),checkedAt:new Date().toISOString()};
    return{status:"unknown",info:"Resposta inválida",checkedAt:new Date().toISOString()};
  }catch(e){return{status:"error",info:String(e.message).slice(0,80),checkedAt:new Date().toISOString()};}
}

function Field({label,value,onChange,placeholder,mono,type="text"}){
  return(<div><label style={{display:"block",fontSize:11,color:"#64748b",marginBottom:3,fontWeight:600}}>{label}</label><input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{padding:"8px 11px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:14,fontFamily:mono?"monospace":"inherit",width:"100%",boxSizing:"border-box",outline:"none",background:"#fff"}}/></div>);
}
function Sel({label,value,onChange,options}){
  return(<div><label style={{display:"block",fontSize:11,color:"#64748b",marginBottom:3,fontWeight:600}}>{label}</label><select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"8px 11px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",background:"#fff"}}>{options.map(o=><option key={o}>{o}</option>)}</select></div>);
}
function StatusBadge({status}){const c=STATUS_CFG[status]||STATUS_CFG.Pendente;return<span style={{background:c.bg,color:c.color,border:`1px solid ${c.border}`,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{status}</span>;}
function MonBadge({ms,checking}){
  if(checking)return<span style={{color:"#2563eb",fontSize:11}}>⏳ verificando…</span>;
  if(!ms)return<span style={{color:"#cbd5e1",fontSize:11}}>—</span>;
  const c=MON_CFG[ms.status]||MON_CFG.unknown;
  const label=ms.status==="delayed"&&ms.delay_minutes?`Atraso ${ms.delay_minutes}min`:c.label;
  return<span style={{background:c.bg,color:c.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{c.icon} {label}</span>;
}

function App(){
  const[list,setList]=useState([]);
  const[ready,setReady]=useState(false);
  const[tab,setTab]=useState("overview");
  const[modal,setModal]=useState(false);
  const[editing,setEditing]=useState(null);
  const[form,setForm]=useState(emptyForm());
  const[fStatus,setFStatus]=useState("Todos");
  const[fAirline,setFAirline]=useState("Todas");
  const[q,setQ]=useState("");
  const[view,setView]=useState("ativos");
  const[delId,setDelId]=useState(null);
  const[toast,setToast]=useState(null);
  const[checking,setChecking]=useState(false);
  const[checkProg,setCheckProg]=useState({done:0,total:0});
  const[lastCheck,setLastCheck]=useState(null);
  const[checkingId,setCheckingId]=useState(null);
  const[portalBook,setPortalBook]=useState(null);
  const[showSettings,setShowSettings]=useState(false);
  const[apiKeyInput,setApiKeyInput]=useState("");
  const[isMobile,setIsMobile]=useState(window.innerWidth<640);
  const listRef=useRef([]);

  useEffect(()=>{
    const h=()=>setIsMobile(window.innerWidth<640);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[]);

  useEffect(()=>{
    const d=lsGet();
    if(d){setList(d.list||[]);listRef.current=d.list||[];if(d.lastCheck)setLastCheck(new Date(d.lastCheck));}
    setApiKeyInput(getApiKey());
    setReady(true);
  },[]);

  useEffect(()=>{listRef.current=list;},[list]);

  useEffect(()=>{
    if(!ready)return;
    const t=setTimeout(()=>runAutoCheck(),6000);
    const iv=setInterval(()=>runAutoCheck(),30*60*1000);
    return()=>{clearTimeout(t);clearInterval(iv);};
  },[ready]);

  function persist(newList,lc){
    setList(newList);listRef.current=newList;
    lsSet({list:newList,lastCheck:(lc||lastCheck)?.toISOString()});
  }
  function notify(msg,type="ok"){setToast({msg,type});setTimeout(()=>setToast(null),3200);}
  function sf(k,v){setForm(f=>({...f,[k]:v}));}
  function openAdd(){setEditing(null);setForm(emptyForm());setModal(true);}
  function openEdit(b){setEditing(b);setForm({...emptyForm(),...b});setModal(true);}

  function handleSave(){
    if(!form.localizador.trim()||!form.cliente.trim()||!form.dataVoo){notify("Preencha: localizador, cliente e data.","err");return;}
    const saved=editing?listRef.current.map(b=>b.id===editing.id?{...b,...form,id:b.id,criadoEm:b.criadoEm}:b):[...listRef.current,{...form,id:crypto.randomUUID(),criadoEm:todayS()}];
    persist(saved);setModal(false);notify(editing?"Reserva atualizada ✓":"Reserva adicionada ✓");
  }
  function handleDelete(id){persist(listRef.current.filter(b=>b.id!==id));setDelId(null);notify("Excluído.","info");}
  function setStatus(id,s){persist(listRef.current.map(b=>b.id===id?{...b,status:s,ultimaVer:todayS()}:b));}
  function markVer(id){persist(listRef.current.map(b=>b.id===id?{...b,ultimaVer:todayS()}:b));notify("Verificado ✓");}

  async function runAutoCheck(){
    const apiKey=getApiKey();
    const cur=listRef.current;
    const toCheck=cur.filter(b=>{const d=daysUntil(b.dataVoo);if(!b.numeroVoo||d===null||d<0||d>7||b.status==="Cancelado")return false;return hoursSince(b.monitorStatus?.checkedAt)>2;});
    if(!toCheck.length){setLastCheck(new Date());return;}
    setChecking(true);setCheckProg({done:0,total:toCheck.length});
    let updated=[...cur];
    for(let i=0;i<toCheck.length;i++){
      const b=toCheck[i];setCheckingId(b.id);
      const res=await checkFlightAPI(apiKey,b.numeroVoo,b.dataVoo,b.origem,b.destino);
      updated=updated.map(x=>x.id===b.id?{...x,monitorStatus:res}:x);
      setList([...updated]);listRef.current=[...updated];setCheckProg({done:i+1,total:toCheck.length});
      if(i<toCheck.length-1)await wait(2500);
    }
    const now=new Date();persist(updated,now);setLastCheck(now);setChecking(false);setCheckingId(null);
    const alerts=updated.filter(b=>["cancelled","delayed","changed"].includes(b.monitorStatus?.status));
    if(alerts.length)notify(`⚠️ ${alerts.length} voo(s) com alteração!`,"err");
  }

  async function checkOne(id){
    const apiKey=getApiKey();
    const b=listRef.current.find(x=>x.id===id);
    if(!b?.numeroVoo){notify("Adicione o nº do voo.","err");return;}
    if(!apiKey){notify("Configure sua API key em ⚙️ Configurações.","err");setShowSettings(true);return;}
    setCheckingId(id);
    const res=await checkFlightAPI(apiKey,b.numeroVoo,b.dataVoo,b.origem,b.destino);
    const updated=listRef.current.map(x=>x.id===id?{...x,monitorStatus:res}:x);
    const now=new Date();persist(updated,now);setLastCheck(now);setCheckingId(null);notify("Status verificado ✓");
  }

  async function openPortal(b){
    const al=AIRLINES.find(a=>a.name===b.airline);
    if(!al?.url)return;
    setPortalBook(b);
    try{await navigator.clipboard.writeText(b.localizador);}catch{}
  }
  function copyText(text,label){navigator.clipboard.writeText(text).then(()=>notify(`${label} copiado ✓`)).catch(()=>notify("Erro ao copiar","err"));}

  function exportData(){
    const blob=new Blob([JSON.stringify({list,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`modo-on-backup-${todayS()}.json`;a.click();
    notify("Dados exportados ✓");
  }
  function importData(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.list){persist(d.list);notify(`${d.list.length} reservas importadas ✓`);}else{notify("Arquivo inválido","err");}}catch{notify("Erro ao importar","err");}};
    reader.readAsText(file);e.target.value="";
  }

  // Derived
  const active=list.filter(b=>{const d=daysUntil(b.dataVoo);return d!==null&&d>=-1&&b.status!=="Cancelado";});
  const next7=active.filter(b=>{const d=daysUntil(b.dataVoo);return d!==null&&d>=0&&d<=7;});
  const pending=list.filter(b=>b.status==="Pendente");
  const monAlerts=list.filter(b=>["cancelled","delayed","changed"].includes(b.monitorStatus?.status));
  const sold=list.filter(b=>b.status!=="Cancelado");
  const totalRec=sold.reduce((s,b)=>s+(parseFloat(b.valorVenda)||0),0);
  const totalCst=sold.reduce((s,b)=>s+(parseFloat(b.valorCusto)||0)+(parseFloat(b.taxaEmbarque)||0),0);
  const totalLuc=totalRec-totalCst;
  const margem=totalRec>0?(totalLuc/totalRec*100):0;
  const tickMed=sold.length>0?totalRec/sold.length:0;

  const monthlyData=(()=>{
    const m={};
    list.forEach(b=>{if(!b.dataVoo||b.status==="Cancelado")return;const[y,mo]=b.dataVoo.split("-");const key=`${y}-${mo}`;const lbl=new Date(b.dataVoo+"T12:00:00").toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});if(!m[key])m[key]={label:lbl,Receita:0,Lucro:0};m[key].Receita+=parseFloat(b.valorVenda)||0;m[key].Lucro+=(parseFloat(b.valorVenda)||0)-(parseFloat(b.valorCusto)||0)-(parseFloat(b.taxaEmbarque)||0);});
    return Object.entries(m).sort(([a],[b])=>a.localeCompare(b)).map(([,v])=>v);
  })();
  const byAirline=(()=>{const m={};sold.forEach(b=>{if(!m[b.airline])m[b.airline]={airline:b.airline,qtd:0,receita:0,lucro:0};m[b.airline].qtd++;m[b.airline].receita+=parseFloat(b.valorVenda)||0;m[b.airline].lucro+=(parseFloat(b.valorVenda)||0)-(parseFloat(b.valorCusto)||0)-(parseFloat(b.taxaEmbarque)||0);});return Object.values(m).sort((a,b)=>b.receita-a.receita);})();

  const shownBookings=list.filter(b=>{const d=daysUntil(b.dataVoo);if(view==="ativos")return d!==null&&d>=-1&&b.status!=="Cancelado";if(view==="historico")return d!==null&&d<-1;return true;}).filter(b=>fStatus==="Todos"||b.status===fStatus).filter(b=>fAirline==="Todas"||b.airline===fAirline).filter(b=>{if(!q)return true;const s=q.toLowerCase();return[b.localizador,b.localizadorCia,b.cliente,b.sobrenome,b.origem,b.destino,b.numeroVoo].some(x=>x?.toLowerCase().includes(s));}).sort((a,b)=>new Date(a.dataVoo)-new Date(b.dataVoo));
  const forMonitor=list.filter(b=>{const d=daysUntil(b.dataVoo);return d!==null&&d>=-1&&d<=14&&b.status!=="Cancelado";}).sort((a,b)=>new Date(a.dataVoo)-new Date(b.dataVoo));

  const inp=(x={})=>({padding:"8px 10px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,outline:"none",background:"#fff",...x});
  const card=(x={})=>({background:"#fff",borderRadius:10,border:"1px solid #e2e8f0",boxShadow:"0 1px 4px rgba(0,0,0,.05)",...x});
  const P=isMobile?"10px 10px 40px":"16px 20px 40px";

  if(!ready)return<div style={{minHeight:"100vh",background:NAVY,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:GOLD,fontSize:15}}>Carregando…</span></div>;

  return(
  <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#f1f5f9",minHeight:"100vh"}}>

    {toast&&<div style={{position:"fixed",top:14,right:14,zIndex:9999,background:toast.type==="err"?"#dc2626":toast.type==="info"?"#2563eb":"#16a34a",color:"#fff",padding:"11px 18px",borderRadius:8,boxShadow:"0 4px 20px rgba(0,0,0,.25)",fontSize:14,fontWeight:500,maxWidth:320}}>{toast.msg}</div>}

    {delId&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div style={{...card(),padding:24,maxWidth:340,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}><div style={{fontWeight:700,fontSize:16,color:NAVY,marginBottom:8}}>Confirmar exclusão</div><div style={{color:"#475569",fontSize:14,marginBottom:20}}>Essa ação não pode ser desfeita.</div><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><button onClick={()=>setDelId(null)} style={{padding:"9px 18px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14}}>Cancelar</button><button onClick={()=>handleDelete(delId)} style={{padding:"9px 18px",borderRadius:8,border:"none",background:"#dc2626",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:600}}>Excluir</button></div></div></div>}

    {portalBook&&(()=>{
      const al=AIRLINES.find(a=>a.name===portalBook.airline);
      const fields=(al?.fields||["localizador","sobrenome"]);
      const fieldDefs=[{key:"localizador",label:"LOCALIZADOR / CÓD. RESERVA",value:portalBook.localizador,mono:true,size:20},{key:"origem",label:"AEROPORTO DE ORIGEM",value:portalBook.origem,mono:true,size:18},{key:"sobrenome",label:"SOBRENOME DO PASSAGEIRO",value:portalBook.sobrenome,mono:false,size:18}].filter(f=>fields.includes(f.key));
      const missing=fieldDefs.filter(f=>!f.value);

    {tab==="financeiro"&&<div style={{padding:P}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:10,marginBottom:18}}>
        {[{label:"Receita bruta",val:brl(totalRec),sub:`${sold.length} vendas`,color:NAVY,bg:"#fff"},{label:"Custo total",val:brl(totalCst),sub:"passagens + taxas",color:"#dc2626",bg:"#fff"},{label:"Lucro bruto",val:brl(totalLuc),sub:pctFmt(margem)+" margem",color:totalLuc>=0?"#16a34a":"#dc2626",bg:totalLuc>=0?"#dcfce7":"#fee2e2"},{label:"Ticket médio",val:brl(tickMed),sub:"por reserva",color:NAVY,bg:"#fff"},{label:"Margem",val:pctFmt(margem),sub:"sobre receita",color:"#7c3aed",bg:"#ede9fe"}].map(s=><div key={s.label} style={{...card(),background:s.bg,padding:"12px 14px"}}><div style={{color:s.color,fontSize:20,fontWeight:800,lineHeight:1}}>{s.val}</div><div style={{color:"#64748b",fontSize:11,marginTop:3}}>{s.label}</div>{s.sub&&<div style={{color:"#94a3b8",fontSize:10,marginTop:1}}>{s.sub}</div>}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"3fr 2fr",gap:14,marginBottom:18}}>
        {monthlyData.length>0&&<div><div style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>Receita vs Lucro por mês</div><div style={{...card(),padding:"14px 8px 8px"}}><ResponsiveContainer width="100%" height={200}><BarChart data={monthlyData} margin={{left:0,right:10}}><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="label" tick={{fontSize:10,fill:"#64748b"}}/><YAxis tickFormatter={v=>v>=1000?`${(v/1000).toFixed(0)}k`:v} tick={{fontSize:10,fill:"#64748b"}}/><Tooltip formatter={v=>brl(v)}/><Bar dataKey="Receita" fill={NAVY} radius={[3,3,0,0]}/><Bar dataKey="Lucro" fill={GOLD} radius={[3,3,0,0]}/><Legend iconSize={10} wrapperStyle={{fontSize:11}}/></BarChart></ResponsiveContainer></div></div>}
        {byAirline.length>0&&<div><div style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>Por companhia</div><div style={{...card(),padding:0,overflow:"hidden"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{borderBottom:"1px solid #f1f5f9",background:"#f8fafc"}}>{["CIA","Qtd","Receita","Margem"].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:600,fontSize:10,color:"#64748b",letterSpacing:.5}}>{h}</th>)}</tr></thead><tbody>{byAirline.map((a,i)=>{const al=AIRLINES.find(x=>x.name===a.airline);const mg=a.receita>0?(a.lucro/a.receita*100):0;return(<tr key={a.airline} style={{borderBottom:"1px solid #f8fafc",background:i%2===0?"#fff":"#fafafa"}}><td style={{padding:"7px 10px"}}><span style={{background:al?.color||"#6b7280",color:"#fff",borderRadius:4,padding:"2px 6px",fontSize:10,fontWeight:700}}>{al?.short||a.airline}</span></td><td style={{padding:"7px 10px",color:"#374151"}}>{a.qtd}</td><td style={{padding:"7px 10px",fontWeight:500,color:"#374151"}}>{brl(a.receita)}</td><td style={{padding:"7px 10px",fontWeight:600,color:mg>=20?"#16a34a":mg>=10?"#d97706":"#dc2626"}}>{pctFmt(mg)}</td></tr>);})}</tbody></table></div></div>}
      </div>
      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>Detalhe por reserva</div>
      <div style={{...card(),padding:0,overflow:"hidden"}}><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}><thead><tr style={{background:NAVY}}>{["Localizador","Cliente","CIA","Data","Venda","Custo","Taxa","Lucro","Margem","Pgto"].map(h=><th key={h} style={{padding:"9px 10px",textAlign:"left",color:"rgba(255,255,255,.65)",fontWeight:600,fontSize:10,letterSpacing:.5,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead><tbody>{sold.sort((a,b)=>new Date(b.criadoEm||0)-new Date(a.criadoEm||0)).map((b,i)=>{const v=parseFloat(b.valorVenda)||0;const c=(parseFloat(b.valorCusto)||0)+(parseFloat(b.taxaEmbarque)||0);const l=v-c;const mg=v>0?(l/v*100):0;const al=AIRLINES.find(a=>a.name===b.airline);return(<tr key={b.id} style={{borderBottom:"1px solid #f1f5f9",background:i%2===0?"#fff":"#fafafa"}}><td style={{padding:"8px 10px",fontFamily:"monospace",fontWeight:700,color:NAVY,fontSize:13}}>{b.localizador}</td><td style={{padding:"8px 10px",fontWeight:500,whiteSpace:"nowrap"}}>{b.cliente}</td><td style={{padding:"8px 10px"}}><span style={{background:al?.color||"#6b7280",color:"#fff",borderRadius:4,padding:"2px 6px",fontSize:10,fontWeight:700}}>{al?.short||b.airline}</span></td><td style={{padding:"8px 10px",whiteSpace:"nowrap",color:"#475569"}}>{fmtFull(b.dataVoo)}</td><td style={{padding:"8px 10px",fontWeight:600,color:"#374151"}}>{v?brl(v):<span style={{color:"#cbd5e1"}}>—</span>}</td><td style={{padding:"8px 10px",color:"#475569"}}>{parseFloat(b.valorCusto)?brl(b.valorCusto):<span style={{color:"#cbd5e1"}}>—</span>}</td><td style={{padding:"8px 10px",color:"#475569"}}>{parseFloat(b.taxaEmbarque)?brl(b.taxaEmbarque):<span style={{color:"#cbd5e1"}}>—</span>}</td><td style={{padding:"8px 10px",fontWeight:700,color:l>=0?"#16a34a":"#dc2626"}}>{v?brl(l):<span style={{color:"#cbd5e1"}}>—</span>}</td><td style={{padding:"8px 10px",fontWeight:600,color:mg>=20?"#16a34a":mg>=10?"#d97706":"#dc2626"}}>{v?pctFmt(mg):<span style={{color:"#cbd5e1"}}>—</span>}</td><td style={{padding:"8px 10px",fontSize:11,color:"#475569",whiteSpace:"nowrap"}}>{b.formaPagamento||"—"}{b.parcelas&&b.parcelas!=="1"?` ${b.parcelas}×`:""}</td></tr>);})}
        <tr style={{background:"#f8fafc",borderTop:"2px solid #e2e8f0",fontWeight:700}}><td colSpan={4} style={{padding:"9px 10px",color:NAVY,fontSize:11}}>TOTAIS · {sold.length} reservas</td><td style={{padding:"9px 10px",color:"#374151"}}>{brl(totalRec)}</td><td style={{padding:"9px 10px",color:"#374151"}}>{brl(sold.reduce((s,b)=>s+(parseFloat(b.valorCusto)||0),0))}</td><td style={{padding:"9px 10px",color:"#374151"}}>{brl(sold.reduce((s,b)=>s+(parseFloat(b.taxaEmbarque)||0),0))}</td><td style={{padding:"9px 10px",color:totalLuc>=0?"#16a34a":"#dc2626"}}>{brl(totalLuc)}</td><td style={{padding:"9px 10px",color:margem>=20?"#16a34a":margem>=10?"#d97706":"#dc2626"}}>{pctFmt(margem)}</td><td/></tr>
      </tbody></table></div></div>
    </div>}

    {/* TAB MONITORAMENTO */}
    {tab==="monitoramento"&&<div style={{padding:P}}>
      <div style={{...card(),padding:"14px 16px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div><div style={{fontWeight:700,color:NAVY,fontSize:14}}>Monitoramento Automático</div><div style={{color:"#64748b",fontSize:12,marginTop:3}}>Verifica a cada 30 min · Voos com nº cadastrado nos próximos 7 dias</div>{lastCheck&&<div style={{color:"#94a3b8",fontSize:11,marginTop:2}}>Última verificação: {lastCheck.toLocaleString("pt-BR")}</div>}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {!getApiKey()&&<button onClick={()=>setShowSettings(true)} style={{background:"#fef3c7",border:"1px solid #fbbf24",borderRadius:7,padding:"8px 12px",fontSize:12,cursor:"pointer",color:"#92400e",fontWeight:600}}>⚙️ Config. API key</button>}
          <button onClick={runAutoCheck} disabled={checking} style={{background:NAVY,color:"#fff",border:"none",borderRadius:7,padding:"9px 14px",fontWeight:600,cursor:checking?"not-allowed":"pointer",fontSize:12,opacity:checking?0.6:1}}>{checking?`⏳ ${checkProg.done}/${checkProg.total}…`:"🔍 Verificar agora"}</button>
        </div>
      </div>
      {monAlerts.length>0&&<div style={{background:"#fee2e2",border:"2px solid #fca5a5",borderRadius:10,padding:"12px 16px",marginBottom:14}}><div style={{fontWeight:700,color:"#991b1b",fontSize:13,marginBottom:8}}>🔴 {monAlerts.length} voo(s) com alteração</div>{monAlerts.map(b=><div key={b.id} style={{color:"#7f1d1d",fontSize:12,marginBottom:3}}><strong style={{fontFamily:"monospace"}}>{b.localizador}</strong> · {b.cliente} · {b.origem}→{b.destino} · {fmtFull(b.dataVoo)} — <strong>{b.monitorStatus?.info||b.monitorStatus?.status}</strong></div>)}</div>}
      {forMonitor.length===0?<div style={{textAlign:"center",padding:"50px 0",color:"#94a3b8"}}><div style={{fontSize:48}}>🔍</div><div style={{fontSize:14,color:"#64748b",marginTop:12}}>Nenhum voo ativo nos próximos 14 dias.</div></div>
      :<div style={{...card(),padding:0,overflow:"hidden"}}><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:780}}><thead><tr style={{background:NAVY}}>{["Localizador","Cliente","Rota","Data","Nº Voo","Status","Info","Atualizado","Ação"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",color:"rgba(255,255,255,.65)",fontWeight:600,fontSize:10,letterSpacing:.5,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead><tbody>{forMonitor.map((b,i)=>{const d=daysUntil(b.dataVoo);const al=AIRLINES.find(a=>a.name===b.airline);const ms=b.monitorStatus;const isChk=checkingId===b.id;const alert=["cancelled","delayed","changed"].includes(ms?.status);return(<tr key={b.id} style={{borderBottom:"1px solid #f1f5f9",background:alert?"#fffbeb":i%2===0?"#fff":"#fafafa"}}><td style={{padding:"10px 12px"}}><div style={{fontWeight:700,fontFamily:"monospace",fontSize:13,color:NAVY}}>{b.localizador}</div><span style={{background:al?.color||"#6b7280",color:"#fff",borderRadius:4,padding:"1px 5px",fontSize:9,fontWeight:700}}>{al?.short}</span></td><td style={{padding:"10px 12px",fontWeight:500,whiteSpace:"nowrap"}}>{b.cliente}{b.sobrenome&&<div style={{fontSize:10,color:"#94a3b8",fontFamily:"monospace"}}>{b.sobrenome}</div>}</td><td style={{padding:"10px 12px",fontFamily:"monospace",fontSize:12,color:"#475569",whiteSpace:"nowrap"}}>{b.origem||"?"}→{b.destino||"?"}</td><td style={{padding:"10px 12px",whiteSpace:"nowrap"}}><div style={{fontWeight:500,fontSize:12}}>{fmtFull(b.dataVoo)}</div><div style={{fontSize:10,fontWeight:700,color:d===0?"#dc2626":d<=3?"#d97706":"#94a3b8"}}>{d===0?"Hoje":d===1?"Amanhã":`${d}d`}</div></td><td style={{padding:"10px 12px"}}>{b.numeroVoo?<span style={{fontFamily:"monospace",fontWeight:600,color:"#374151"}}>{b.numeroVoo}</span>:<span style={{color:"#fbbf24",fontSize:11}}>⚠️ Sem nº</span>}</td><td style={{padding:"10px 12px"}}><MonBadge ms={ms} checking={isChk}/></td><td style={{padding:"10px 12px",maxWidth:170,fontSize:11,color:"#475569"}}>{ms?.info||"—"}</td><td style={{padding:"10px 12px",fontSize:11,color:"#94a3b8",whiteSpace:"nowrap"}}>{ms?.checkedAt?new Date(ms.checkedAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"Nunca"}</td><td style={{padding:"10px 12px"}}>{b.numeroVoo?<button onClick={()=>checkOne(b.id)} disabled={!!checkingId||checking} style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",color:"#0284c7",fontWeight:600,opacity:checkingId||checking?0.4:1,whiteSpace:"nowrap"}}>{isChk?"⏳":"🔍"} Verificar</button>:<button onClick={()=>openEdit(b)} style={{background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",color:"#92400e",whiteSpace:"nowrap"}}>✏️ Add nº</button>}</td></tr>);}}</tbody></table></div></div>}
    </div>}

    {/* MODAL */}
    {modal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"16px",overflowY:"auto"}}><div style={{...card(),width:"100%",maxWidth:620,boxShadow:"0 24px 64px rgba(0,0,0,.35)",overflow:"hidden",marginBottom:16}}><div style={{background:NAVY,padding:"13px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:1,borderBottom:`2px solid ${GOLD}`}}><span style={{color:GOLD,fontWeight:700,fontSize:14}}>{editing?"✏️ Editar Reserva":"✈️ Nova Reserva"}</span><button onClick={()=>setModal(false)} style={{background:"none",border:"none",color:"rgba(255,255,255,.5)",fontSize:22,cursor:"pointer",lineHeight:1}}>×</button></div>
    <div style={{padding:"18px 20px",display:"flex",flexDirection:"column",gap:14}}>
      <div><div style={{fontSize:10,fontWeight:700,color:NAVY,letterSpacing:.6,textTransform:"uppercase",marginBottom:10,paddingBottom:6,borderBottom:"1px solid #f1f5f9"}}>📋 Dados da Reserva</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}><Field label="Localizador *" value={form.localizador} mono onChange={v=>sf("localizador",v.toUpperCase().replace(/\s/g,""))} placeholder="ABCDEF"/><Field label="Localizador CIA" value={form.localizadorCia} mono onChange={v=>sf("localizadorCia",v.toUpperCase().replace(/\s/g,""))} placeholder="XYZ789"/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}><Sel label="Companhia Aérea" value={form.airline} onChange={v=>sf("airline",v)} options={AIRLINES.map(a=>a.name)}/><Sel label="Status" value={form.status} onChange={v=>sf("status",v)} options={Object.keys(STATUS_CFG)}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}><Field label="Nome do Passageiro *" value={form.cliente} onChange={v=>sf("cliente",v)} placeholder="Nome completo"/><Field label="Sobrenome (para consulta CIA)" value={form.sobrenome} onChange={v=>sf("sobrenome",v.toUpperCase())} placeholder="SILVA" mono/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}><Field label="Origem" value={form.origem} mono onChange={v=>sf("origem",v.toUpperCase())} placeholder="GRU"/><Field label="Destino" value={form.destino} mono onChange={v=>sf("destino",v.toUpperCase())} placeholder="MIA"/><div><label style={{display:"block",fontSize:11,color:"#64748b",marginBottom:3,fontWeight:600}}>Data do Voo *</label><input type="date" value={form.dataVoo} onChange={e=>sf("dataVoo",e.target.value)} style={{padding:"8px 11px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:14,width:"100%",boxSizing:"border-box",outline:"none"}}/></div></div>
      </div>
      <div><div style={{fontSize:10,fontWeight:700,color:NAVY,letterSpacing:.6,textTransform:"uppercase",marginBottom:10,paddingBottom:6,borderBottom:"1px solid #f1f5f9"}}>🔍 Dados do Voo <span style={{fontWeight:400,color:"#94a3b8",textTransform:"none",fontSize:9}}>(para monitoramento automático)</span></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}><Field label="Nº do Voo" value={form.numeroVoo} mono onChange={v=>sf("numeroVoo",v.toUpperCase())} placeholder="LA3001"/><Field label="Partida" value={form.horarioPartida} onChange={v=>sf("horarioPartida",v)} placeholder="14:30"/><Field label="Chegada" value={form.horarioChegada} onChange={v=>sf("horarioChegada",v)} placeholder="18:45"/></div>
      </div>
      <div><div style={{fontSize:10,fontWeight:700,color:NAVY,letterSpacing:.6,textTransform:"uppercase",marginBottom:10,paddingBottom:6,borderBottom:"1px solid #f1f5f9"}}>💰 Financeiro</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}><Field label="Valor cobrado — R$" value={form.valorVenda} type="number" onChange={v=>sf("valorVenda",v)} placeholder="0.00"/><Field label="Custo passagem — R$" value={form.valorCusto} type="number" onChange={v=>sf("valorCusto",v)} placeholder="0.00"/><Field label="Taxa de embarque — R$" value={form.taxaEmbarque} type="number" onChange={v=>sf("taxaEmbarque",v)} placeholder="0.00"/></div>
        {(parseFloat(form.valorVenda)||0)>0&&(()=>{const v=parseFloat(form.valorVenda)||0;const c=(parseFloat(form.valorCusto)||0)+(parseFloat(form.taxaEmbarque)||0);const l=v-c;const mg=v>0?(l/v*100):0;return(<div style={{background:"#f8fafc",borderRadius:7,padding:"8px 12px",marginBottom:10,display:"flex",gap:16,flexWrap:"wrap",fontSize:12}}><span style={{color:"#64748b"}}>Receita: <strong style={{color:"#374151"}}>{brl(v)}</strong></span><span style={{color:"#64748b"}}>Custo: <strong style={{color:"#374151"}}>{brl(c)}</strong></span><span style={{color:"#64748b"}}>Lucro: <strong style={{color:l>=0?"#16a34a":"#dc2626"}}>{brl(l)}</strong></span><span style={{color:"#64748b"}}>Margem: <strong style={{color:"#7c3aed"}}>{pctFmt(mg)}</strong></span></div>);})()} 
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}><Sel label="Pagamento" value={form.formaPagamento} onChange={v=>sf("formaPagamento",v)} options={PGTO}/><Field label="Parcelas" value={form.parcelas} onChange={v=>sf("parcelas",v)} placeholder="1"/></div>
      </div>
      <Field label="Observações" value={form.obs} onChange={v=>sf("obs",v)} placeholder="Assento, bagagem, notas…"/>
      <div style={{borderTop:"1px solid #f1f5f9",paddingTop:14,display:"flex",gap:10,justifyContent:"flex-end"}}><button onClick={()=>setModal(false)} style={{padding:"10px 20px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,color:"#64748b"}}>Cancelar</button><button onClick={handleSave} style={{padding:"10px 24px",borderRadius:8,border:"none",background:NAVY,color:"#fff",cursor:"pointer",fontSize:14,fontWeight:700}}>{editing?"Salvar":"Adicionar"}</button></div>
    </div></div></div>}

  </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
